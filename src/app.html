<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Offline-first law school reviewer — MCQ practice, ALAC essays, and codal study guides for Philippine law subjects." />
		<meta name="theme-color" content="#efebdf" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121518" media="(prefers-color-scheme: dark)" />
		<script>
			// Apply the saved theme (or the system preference) before first paint to avoid a flash.
			(function () {
				try {
					var m = localStorage.getItem('law_theme');
					var dark = m === 'dark' || ((m === null || m === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
